name: Check README updated

on:
  pull_request:
    branches: [master]

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check README.md has changes
        run: |
          if git diff --name-only origin/master...HEAD | grep -q '^README.md$'; then
            echo "README.md has been updated."
          else
            echo "::error::README.md was not updated. Please add a bullet point describing your change."
            exit 1
          fi
